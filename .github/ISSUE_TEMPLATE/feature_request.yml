name: Feature request
description: Suggest a new feature, tool or template
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workflow or problem, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Commands, flags or config you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives
      description: For example, a custom registry entry or template you use today.
