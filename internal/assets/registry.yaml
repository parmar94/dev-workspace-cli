# Built-in catalog. Names must be unique across languages, agents and tools.
# Each entry has either a dev container `feature` (with optional `options`)
# or a `script` run from post-create.sh as the remote user.

languages:
  go:
    description: Go toolchain
    feature: ghcr.io/devcontainers/features/go:1
    options:
      version: latest
  node:
    description: Node.js (via nvm) and npm
    feature: ghcr.io/devcontainers/features/node:1
    options:
      version: lts
  python:
    description: Python 3 and pip
    feature: ghcr.io/devcontainers/features/python:1
    options:
      version: latest
  rust:
    description: Rust toolchain (rustup)
    feature: ghcr.io/devcontainers/features/rust:1
  java:
    description: Java JDK
    feature: ghcr.io/devcontainers/features/java:1

agents:
  claude:
    description: Claude Code
    feature: ghcr.io/anthropics/devcontainer-features/claude-code:1.0
    requires: [node]
    mounts:
      - source=dws-claude-${devcontainerId},target=/home/vscode/.claude,type=volume
  codex:
    description: OpenAI Codex CLI
    script: npm install -g @openai/codex
    requires: [node]
    mounts:
      - source=dws-codex-${devcontainerId},target=/home/vscode/.codex,type=volume

tools:
  gh:
    description: GitHub CLI
    feature: ghcr.io/devcontainers/features/github-cli:1
  docker-in-docker:
    description: Docker engine inside the container
    feature: ghcr.io/devcontainers/features/docker-in-docker:2
  aws-cli:
    description: AWS CLI v2
    feature: ghcr.io/devcontainers/features/aws-cli:1
  terraform:
    description: Terraform
    feature: ghcr.io/devcontainers/features/terraform:1
  kubectl:
    description: kubectl, helm and minikube
    feature: ghcr.io/devcontainers/features/kubectl-helm-minikube:1
  jq:
    description: JSON processor
    script: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq
  ripgrep:
    description: Fast recursive grep (rg)
    script: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
  fzf:
    description: Fuzzy finder
    script: sudo apt-get update && sudo apt-get install -y --no-install-recommends fzf
